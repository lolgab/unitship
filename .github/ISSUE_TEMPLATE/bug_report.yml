name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: unitship version (`unitship --version`)
    validations: {required: true}
  - type: input
    id: os
    attributes:
      label: Server OS and supervisor (systemd or local)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (commands and output, without secrets)
